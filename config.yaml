extensions:
  trazr: 
    ws_read_timeout: 120s
    #endpoint: "0.0.0.0:18888"  # Change this port as needed
    # No config needed for hello world extension

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 1024
    timeout: 250ms
    send_batch_max_size: 1024
  trazr:

exporters:
  trazr:
    sending_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 1
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
 
  file:
    path: ./logs/trazr2.log
  debug:
    verbosity: detailed

service:
  extensions: [trazr]
  #telemetry:
  #  logs:
  #    level: "debug"
  pipelines:
    profiles:
      receivers: [otlp]
      # Batch and the custom trazr processor do not support profiles.
      processors: []
      exporters: [trazr]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [trazr]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [trazr]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [trazr]

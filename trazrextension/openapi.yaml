    ProfileEntryDTO:
      type: object
      description: Version 1 requires otlp-profiles-protobuf, schema version 1, and valid base64 protobuf containing
        exactly one resource, scope and profile with a valid complete dictionary. Searchable summaries derive from the
        payload. Timestamp is the signed-index fallback for zero or unsigned out-of-range source time. Version 0 retains
        historical opaque bytes and caller summaries without asserting wire compatibility.
      properties:
        timestamp:
          type: string
          format: date-time
        service_name:
          type: string
        service_namespace:
          type: string
        service_instance_id:
          type: string
        profile_type:
          type: string
          description: Arbitrary OTLP sample-type label, such as cpu or alloc_space.
        duration_ns:
          type: integer
          format: int64
          description: Legacy signed duration summary; zero for unsigned durations outside signed bigint.
        sample_type:
          type: string
        sample_unit:
          type: string
        profile_bytes:
          type: string
          format: byte
          description: Exact persisted protobuf or legacy bytes encoded as base64.
        attributes:
          type: object
          additionalProperties: true
          description: Searchable summaries; non-finite doubles use OTLP JSON strings NaN, Infinity and -Infinity.
        resource_attributes:
          type: object
          additionalProperties: true
        resource_schema_url:
          type: string
        scope_name:
          type: string
        scope_version:
          type: string
        scope_attributes:
          type: object
          additionalProperties: true
        scope_dropped_attr_count:
          type: integer
          format: int32
          description: Legacy signed scope dropped count, omitted when uint32 exceeds signed int32.
        scope_schema_url:
          type: string
        metadata:
          type: object
          additionalProperties: true
        profile_storage_version:
          type: integer
          enum:
          - 0
          - 1
          default: 0
        profile_encoding:
          type: string
          enum:
          - legacy-unversioned
          - otlp-profiles-protobuf
        profile_schema_version:
          type: string
          enum:
          - '1'
          nullable: true
      required:
      - timestamp

    ProfileEntryResponse:
      type: object
      properties:
        profile_id:
          type: integer
          format: int64
          description: Database row identifier, distinct from the source OTLP profile ID.
        timestamp_ns:
          type: integer
          format: int64
          description: Signed database query index; ingestion time when source time is zero or outside signed bigint.
        timestamp:
          type: string
          format: date-time
        service_name:
          type: string
        service_namespace:
          type: string
        service_instance_id:
          type: string
        profile_type:
          type: string
          description: Arbitrary OTLP sample-type label, such as cpu or alloc_space.
        duration_ns:
          type: integer
          format: int64
          description: Legacy signed duration summary; zero for unsigned durations outside signed bigint.
        sample_type:
          type: string
        sample_unit:
          type: string
        profile_storage_version:
          type: integer
          format: int32
          description: 0 for unversioned legacy storage; 1 for explicitly versioned current OTLP storage.
        profile_encoding:
          type: string
          description: legacy-unversioned or otlp-profiles-protobuf.
        profile_schema_version:
          type: string
          description: Compiled OTLP development wire metadata version for current rows, presently 1. Does not assert
            historical wire compatibility.
        otel_profile_id:
          type: string
          description: Source 16-byte profile identity in hexadecimal.
        profile_time_unix_nano:
          type: string
          pattern: ^[0-9]+$
          description: Exact unsigned source nanoseconds, including zero and values above signed bigint.
        duration_nano:
          type: string
          pattern: ^[0-9]+$
          description: Exact unsigned source duration in nanoseconds.
        profile_bytes:
          type: string
          format: byte
          description: Exact persisted protobuf or legacy bytes encoded as base64.
        profile_data:
          description: Complete OTLP JSON container and dictionary for decoded current rows. Historical JSON remains
            legacy JSON; legacy binary is omitted.
        profile_decode_status:
          type: string
          enum:
          - decoded
          - legacy-opaque
          - legacy-json
          - error
        profile_decode_error:
          type: string
          description: Explicit failure for invalid or unsupported versioned storage; raw base64 bytes are still returned.
        attributes:
          type: object
          additionalProperties: true
          description: Searchable summaries; non-finite doubles use OTLP JSON strings NaN, Infinity and -Infinity.
        resource_attributes:
          type: object
          additionalProperties: true
        resource_schema_url:
          type: string
        scope_name:
          type: string
        scope_version:
          type: string
        scope_attributes:
          type: object
          additionalProperties: true
        scope_dropped_attr_count:
          type: integer
          format: int32
          description: Legacy signed scope dropped count, omitted when uint32 exceeds signed int32.
        scope_schema_url:
          type: string
        metadata:
          type: object
          additionalProperties: true
        dropped_attr_count:
          type: integer
          format: int32
          description: Legacy signed profile dropped count, distinct from scope; omitted on signed overflow.
        profile_dropped_attributes_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
        resource_dropped_attributes_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
        scope_dropped_attributes_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
      required:
      - profile_id
      - timestamp_ns
      - timestamp
      - duration_ns
      - profile_bytes
      - profile_storage_version
      - profile_encoding
      - profile_decode_status

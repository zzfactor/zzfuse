          format: date-time
        value:
          type: number
        sum:
          type: number
        min:
          type: number
        max:
          type: number
        zero_threshold:
          type: number
        count:
          type: integer
          format: int64
        zero_count:
          type: integer
          format: int64
        flags:
          type: integer
          format: int32
        scope_dropped_attr_count:
          type: integer
          format: int32
        aggregation_temporality:
          type: integer
          format: int32
        scale:
          type: integer
          format: int32
        positive_offset:
          type: integer
          format: int32
        negative_offset:
          type: integer
          format: int32
        is_monotonic:
          type: boolean
        attributes:
          type: object
          additionalProperties: true
        resource_attributes:
          type: object
          additionalProperties: true
        scope_attributes:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        buckets:
          description: Histogram distribution, including bucket_counts and explicit_bounds for OTLP records.
        quantiles:
          type: array
          items:
            type: object
            properties:
              quantile:
                type: number
              value:
                type: number
        exemplars:
          type: array
          items:
            type: object
            additionalProperties: true
        positive_bucket_counts:
          type: array
          items:
            type: integer
            format: int64
        negative_bucket_counts:
          type: array
          items:
            type: integer
            format: int64
      example:
        id: 1
        timestamp_ns: 1791979200000000000
        timestamp: '2026-10-14T12:00:00Z'

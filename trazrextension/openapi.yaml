  /api/v1/stream/logs:
    get:
      summary: Stream new log entries (WebSocket)
      description: |
        Streams log entries in realtime. If `last` or `start` is provided, the server preloads the requested window respecting the direction parameter and then continues live.
        If `cursor` is provided, preloads from cursor position maintaining all original query filters.
        Accepts the same filters as GET /api/v1/logs via query string.
        In-band filter update:
          client → server: {"type":"set_filter","filter":{...}}
          server → client: {"type":"ack"} or {"type":"error","message":"..."}
        Client keepalive messages:
          - The server accepts and silently ignores the following optional client messages:
              {"type":"keepalive"}
              {"type":"ping"}
            These do not affect filters or state and are primarily for client-side keepalive semantics.
        Backpressure:
          server may emit {"type":"dropped","count":N} when messages are dropped.
        Keepalive and ping/pong:
          - Server auto-responds to pings and extends the read deadline on pong or ping (`ws_read_timeout`, default 120s).
          - Optional server-initiated pings when `ws_ping_interval` > 0 (disabled by default). Useful for browsers and through proxies/NAT.
          - Inbound message size limited by `ws_read_limit`; idle/read errors close the socket.
      parameters:
        - in: query
          name: start
          schema: { type: string, format: date-time }
          description: Start time (RFC3339). If omitted and `last` not provided, defaults to 1 hour ago.
        - in: query
          name: end
          schema: { type: string, format: date-time }
          description: End time (RFC3339). Defaults to now if omitted.
        - in: query
          name: last
          schema:
            type: string
            pattern: '^[0-9]+[smhd]$'
            example: '1h'
          description: Shorthand time window (e.g., 15m, 1h, 2d). Used if start/end omitted. Default last=1h.
        - $ref: '#/components/parameters/StreamCursor'
        - in: query
          name: q
          schema: { type: string }
          description: Text search over rendered message/body (case-insensitive).
        - in: query
          name: q_mode
          schema: { type: string, enum: [simple, regex], default: simple }
          description: Search mode. If regex, `q` is RE2.
        - in: query
          name: q_flags
          schema:
            type: array
            items: { type: string, enum: [i, m] }
          style: form
          explode: true
          description: Optional regex flags (i=case-insensitive, m=multi-line). Only used when q_mode=regex.
        - in: query
          name: service_in
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          description: Repeat param for OR match across services.
        - in: query
          name: severity_min
          schema: { type: integer, minimum: 1, maximum: 24 }
          description: Minimum severity_number (inclusive).
        - in: query
          name: severity_max
          schema: { type: integer, minimum: 1, maximum: 24 }
          description: Maximum severity_number (inclusive).
        - in: query
          name: severity_group_in
          schema:
            type: array
            items: { type: string, enum: [TRACE, DEBUG, INFO, WARN, ERROR, FATAL] }
          style: form
          explode: true
          description: "Severity groups mapped on server: TRACE 1–4, DEBUG 5–8, INFO 9–12, WARN 13–16, ERROR 17–20, FATAL 21–24."
        - in: query
          name: severity_text_in
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          description: Exact severity_text variants (case-insensitive).
        - in: query
          name: attr.eq
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
          description: "Attribute equals. Example: attr.eq[env]=staging (repeat across keys for AND)."
        - in: query
          name: attr.in
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string, description: 'Comma-separated values, e.g., v1,v2' }
          description: "Attribute IN list (OR within key). Example: attr.in[env]=dev,staging."
        - in: query
          name: attr.exists
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: boolean }
          description: "Attribute existence. Example: attr.exists[user_id]=true."
        - in: query
          name: res_attr.eq
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
          description: Resource attribute equals (same semantics as attr.eq).
        - in: query
          name: res_attr.in
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string, description: 'Comma-separated values' }
          description: Resource attribute IN (same semantics as attr.in).
        - in: query
          name: res_attr.exists
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: boolean }
          description: Resource attribute existence (same semantics as attr.exists).
        - in: query
          name: schema
          schema: { type: string }
          description: Postgres schema to use (default otel).
        - in: query
          name: wait_for_established
          schema: { type: boolean, default: false }
          description: If true, connection waits until subscription is established before returning the first message.
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '200':
          description: Example stream message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntryResponse'

  /api/v1/stream/runs:
    get:
      summary: Stream new run entries (WebSocket)
      description: |
        Streams run entries in realtime. If `last` or `start` is provided, the server preloads the requested window respecting the direction parameter and then continues live.
        If `cursor` is provided, preloads from cursor position maintaining all original query filters.
        Message types:
          - {"type":"run_upsert","run": RunEntryResponse}
          - {"type":"run_ended","run": RunEntryResponse}
          - {"type":"ready"} after preload completes
          - {"type":"dropped","count":N} for backpressure
        Keepalive and ping/pong:
          - Server auto-responds to pings and extends the read deadline on pong or ping (`ws_read_timeout`, default 120s).
          - Optional server-initiated pings when `ws_ping_interval` > 0 (disabled by default). Useful for browsers and through proxies/NAT.
          - Inbound message size limited by `ws_read_limit`; idle/read errors close the socket.
      parameters:
        - in: query
          name: start
          schema: { type: string, format: date-time }
          description: Start time (RFC3339). If omitted and `last` not provided, defaults to 1 hour ago.
        - in: query
          name: end
          schema: { type: string, format: date-time }
          description: End time (RFC3339). Defaults to now if omitted.
        - in: query
          name: last
          schema:
            type: string
            pattern: '^[0-9]+[smhd]$'
            example: '1h'
          description: Shorthand time window (e.g., 15m, 1h, 2d). Used if start/end omitted. Default last=1h.
        - $ref: '#/components/parameters/StreamCursor'
        - in: query
          name: service
          schema: { type: string }
          description: Filter by service name.
        - in: query
          name: name
          schema: { type: string }
          description: Filter by run name.
        - in: query
          name: session_id
          schema: { type: string }
          description: Filter by session ID.
        - in: query
          name: run_type
          schema: { type: integer }
          description: "Filter by run type (1: time based, 2: trace based)."
        - in: query
          name: active_only
          schema: { type: boolean, default: false }
          description: If true, only streams active (non-ended) runs.
        - in: query
          name: wait_for_established
          schema: { type: boolean, default: false }
          description: If true, connection waits until subscription is established before returning the first message.
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '200':
          description: Example stream messages
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WSRunUpsert'
                  - $ref: '#/components/schemas/WSRunEnded'
                  - $ref: '#/components/schemas/WSReady'
                  - $ref: '#/components/schemas/WSDropped'
  /api/v1/stream/perfmonitor:
    get:
      summary: Stream performance monitor metrics (WebSocket)
      description: |
        Streams periodic performance and health metrics (memory, storage, database, HTTP, notifier, embedding, template, event_bus).
        Supports initial preload snapshot and configurable update interval.
        Keepalive and ping/pong:
          - Server auto-responds to pings (PongHandler) and extends the read deadline on pong (`ws_read_timeout`, default 90s).
          - Optional server-initiated pings when `ws_ping_interval` > 0 (disabled by default). Useful for browsers and through proxies/NAT.
          - Inbound message size limited by `ws_read_limit`; idle/read errors close the socket.
      parameters:
        - in: query
          name: preload
          schema: { type: boolean, default: true }
          description: If true, sends an initial snapshot before live updates.
        - in: query
          name: wait_for_established
          schema: { type: boolean, default: false }
          description: If true, connection waits until subscription is established before returning the first message.
        - in: query
          name: interval
          schema: { type: integer, default: 2 }
          description: Update interval in seconds.
        - in: query
          name: summary
          schema: { type: boolean, default: false }
          description: If true, streams a compact summary instead of full metrics.
        - in: query
          name: fields
          schema: { type: string }
          description: Optional comma-separated whitelist of top-level fields (e.g., memory,storage,http).
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '200':
          description: Example stream message
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [perf_update, ready, dropped, error]
                  metrics:
                    type: object
  /api/v1/stream/user/notifications:
    get:
      summary: Stream user notifications (WebSocket)
      description: |
        Streams user-targeted notifications in realtime.
        Message types:
          - {"type":"notification","topic":"...","data":{...},"ts":"RFC3339","id":"...","meta":{...},"seq":123}
          - {"type":"ready"} after any optional preload completes
          - {"type":"dropped","count":N} when messages are dropped due to backpressure
        In-band control:
          client → server: {"type":"set_filter","filter":{"topics":["mcp","alerts"]}}
          server → client: {"type":"ack"} or {"type":"error","message":"..."}
        Keepalive and ping/pong:
          - Server auto-responds to pings and extends the read deadline on pong or ping (`ws_read_timeout`).
          - Optional server-initiated pings when configured.
      parameters:
        - in: query
          name: topics
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          description: Optional list of topics to include (e.g., mcp,alerts,system). If omitted, all topics are streamed.
        - in: query
          name: wait_for_established
          schema: { type: boolean, default: false }
          description: If true, connection waits until subscription is established before returning the first message.
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '200':
          description: Example stream messages
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WSNotification'
                  - $ref: '#/components/schemas/WSReady'
                  - $ref: '#/components/schemas/WSDropped'

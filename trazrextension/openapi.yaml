        - in: path
          name: key
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPatchRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntryResponse' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '412': { description: Precondition failed (ETag mismatch) }
    delete:
      summary: Delete an org config
      parameters:
        - in: path
          name: org_id
          required: true
          schema: { type: string }
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /api/v1/orgs/{org_id}/projects/{project_id}/configs:
    get:
      summary: List project configs
      parameters:
        - in: path
          name: org_id
          required: true
          schema: { type: string }
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: query
          name: prefix
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Base64-encoded cursor for pagination.
        - in: query
          name: direction
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: List of project config entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigListResult' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /api/v1/orgs/{org_id}/projects/{project_id}/configs/{key}:
    get:
      summary: Get a project config by key
      parameters:
        - in: path
          name: org_id
          required: true
          schema: { type: string }
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Config entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntryResponse' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    put:
      summary: Upsert a project config (replace)
      parameters:
        - in: path
          name: org_id
          required: true
          schema: { type: string }
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: key
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigUpsertRequest' }
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntryResponse' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntryResponse' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '412': { description: Precondition failed (ETag mismatch) }
    patch:
      summary: Update a project config (deep-merge objects)
      parameters:
        - in: path
          name: org_id
          required: true
          schema: { type: string }
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: key
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPatchRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigEntryResponse' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '412': { description: Precondition failed (ETag mismatch) }
    delete:
      summary: Delete a project config
      parameters:
        - in: path
          name: org_id
          required: true
          schema: { type: string }
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /api/v1/user/notifications:
    post:
      summary: Enqueue a user notification (trusted services only)
      description: |
        Allows trusted services to enqueue a notification for a specific user.
        If the user has an active notification stream, the message is delivered immediately. Otherwise it is stored until retention expiry.
      parameters:
        - $ref: '#/components/parameters/UserKeyHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationEnqueueRequest' }
      responses:
        '200':
          description: Enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationEnqueueResponse' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '409': { description: Duplicate idempotency key }
        '500': { description: Internal error }
  /api/v1/vectorstore/search:
    post:
      summary: VectorStore semantic search
      description: >
        Perform a semantic vector search over the specified vector store. Returns the top-k most similar documents, filtered by an optional score threshold (lower is more similar; default 0.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Semantic search query string
                top_k:
                  type: integer
                  description: "Number of top results to return (default: 5)"
                store_id:
                  type: string
                  description: Vector store identifier (default otel)
                score_threshold:
                  type: number
                  format: float
                  description: >
                    Optional. Only results with similarity score < threshold are returned. Lower is more similar. Default: 0.3.
              required:
                - query
      responses:
        '200':
          description: Vector search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          type: string
                        score:
                          type: number
                        timestamp:
                          type: string
                          format: date-time
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/schemas:
    get:
      summary: Get available schemas
      description: Returns a list of all available database schemas with their configuration and status. Requires JWT Bearer authentication.
      responses:
        '200':
          description: List of available schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaList'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/health:
    get:
      summary: Health check
      description: Returns 200 if the service is healthy.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/version:
    get:
      summary: Get API version
      description: Returns the current API version.
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 1.0.0
  # Authentication endpoints
  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: Create a user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '200':
          description: Registration result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      summary: Login and obtain JWT
      description: Authenticate with email and password and receive a short-lived JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/request-password-reset:
    post:
      tags:
      - Authentication
      summary: Request private password reset email
      security: []
      description: Uses a bounded asynchronous private SMTP queue and a fixed frontend reset URL with token only in its browser fragment. Valid requests receive the
        same generic response for known or missing accounts and delivery/storage failures. Tokens are never returned
        or logged. No token/account lookup occurs when secure delivery is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
      responses:
        '200':
          description: Generic accepted response independent of account existence or delivery outcome
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - if the account exists, a password reset email will be sent
        '400':
          description: Invalid email or request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: Secure private SMTP delivery or frontend reset URL is unconfigured or invalid; no token issued
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Consume one-time token and reset password
      security: []
      description: Reset tokens expire after one hour. Password update and token consumption commit atomically. Concurrent
        replay, reuse and expired tokens are rejected; a failed password update does not consume the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetPerformRequest'
      responses:
        '200':
          description: Password reset completed
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - password reset successful
        '400':
          description: Invalid input, expired token or token replay
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '500':
          description: Password reset could not complete
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  /api/v1/auth/whoami:
    get:
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/renew:
    post:
      summary: Renew JWT
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JWT renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # API key endpoints
  /api/v1/auth/apikeys:
    get:
      summary: List API keys for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new API key
      description: Creates a long-lived user-scoped API key. The plaintext key is returned only once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/apikeys/{id}:
    delete:
      summary: Revoke an API key by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /api/v1/auth/apikeys/exchange:
    post:
      summary: Exchange API key for short-lived JWT
      description: |
        Requires `X-API-Key` header. Returns a short-lived JWT for use as a Bearer token.
        If the API key is scoped to an organization and/or project, the issued JWT will include `org_id` and/or `project_id` claims.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    OrgIDHeader:
      in: header
      name: X-Org-ID
      required: false
      schema:
        type: string
      description: Optional organization scope. Must match JWT org_id if present.
    ProjectIDHeader:
      in: header
      name: X-Project-ID
      required: false
      schema:
        type: string
      description: Optional project scope. Must match JWT project_id if present.
    OrgIDQuery:
      in: query
      name: org_id
      required: false
      schema:
        type: string
      description: Optional organization scope. Must match JWT org_id if present. If provided and headers missing, server may inject X-Org-ID.
    ProjectIDQuery:
      in: query
      name: project_id
      required: false
      schema:
        type: string
      description: Optional project scope. Must match JWT project_id if present. If provided and headers missing, server may inject X-Project-ID.
    UserKeyHeader:
      in: header
      name: X-User-Key
      required: false
      schema:
        type: string
      description: Optional user key override for trusted service-to-service calls targeting a specific end user.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
      description: Optional idempotency key. Duplicate requests with the same key return the original result.
    IfMatchHeader:
      in: header
      name: If-Match
      required: false
      schema:
        type: string
      description: Optional ETag for conditional updates. When provided and mismatched, server returns 412.
  schemas:
    # Auth schemas
    AuthRegisterRequest:
      type: object
      description: Username-based registration. Email is optional profile info; username is the primary login identifier (may itself be an email-like string).
      required: [Username, Password]
      properties:
        Username:
          type: string
          description: Primary login identifier. Must be unique (case-insensitive). Can be an email string if desired.
        Password:
          type: string
          format: password
        Email:
          type: string
          format: email
          description: Optional profile email; not required for login.
        Role:
          type: string
          description: Optional role for the user (admin-only when enabled server-side)
    AuthLoginRequest:
      type: object
      description: Username-based login. Provide username and password. For backward compatibility, servers may accept an email string in the username field.
      required: [Username, Password]
      properties:
        Username:
          type: string
          description: Primary login identifier (case-insensitive). Can be an email string.
        Password:
          type: string
          format: password
    WhoAmIResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        roles:
          type: array
          items:
            type: string
    TokenResponse:
      type: object
      properties:
        token:
          type: string
      description: A JWT Bearer token. When issued via API key exchange, it may include org_id/project_id claims (see JWTClaims).
    JWTClaims:
      type: object
      description: Representative structure of claims included in issued tokens.
      properties:
        sub:
          type: string
        email:
          type: string
        user_id:
          type: string
        org_id:
          type: string
          description: Present when the token is scoped to an organization
        project_id:
          type: string
          description: Present when the token is scoped to a project
        scopes:
          type: array
          items:
            type: string
        iss:
          type: string
        aud:
          type: array
          items:
            type: string
        exp:
          type: integer
        iat:
          type: integer
        nbf:
          type: integer
        jti:
          type: string
    PasswordResetRequestRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    PasswordResetPerformRequest:
      type: object
      required:
      - token
      - new_password
      properties:
        token:
          type: string
          minLength: 1
          description: Private one-time token from the delivered reset email URL fragment.
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: At least 8 bytes; bcrypt accepts at most 72 bytes including any configured server pepper.
    APIKey:
      type: object
      properties:
        ID:
          type: string
        Name:
          type: string
        Prefix:
          type: string
        Scopes:
          type: array
          items:
            type: string
        OrgID:
          type: string
          nullable: true
          description: Optional organization scope for this key
        ProjectID:
          type: string
          nullable: true
          description: Optional project scope for this key
        ExpiresAt:
          type: string
          format: date-time
          nullable: true
        CreatedAt:
          type: string
          format: date-time
        LastUsedAt:
          type: string
          format: date-time
          nullable: true
    APIKeyCreateRequest:
      type: object
      required: [Name]
      properties:
        Name:
          type: string
        Scopes:
          type: array
          items:
            type: string
        OrgID:
          type: string
          description: Optional organization to scope the key to
        ProjectID:
          type: string
          description: Optional project to scope the key to
        ExpiresIn:
          type: string
          description: Optional duration like 30d, 90d. If omitted, key does not expire.
    APIKeyCreateResponse:
      type: object
      properties:
        Key:
          type: string
          description: Plaintext API key, returned only once. Store it securely.
        APIKey:
          $ref: '#/components/schemas/APIKey'
    APIKeyListResponse:
      type: object
      properties:
        Keys:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
    # Insert schemas
    LogEntry:
      type: object
      required: [Timestamp, ServiceName, Body]
      properties:
        Timestamp:
          type: string
          format: date-time
        ServiceName:
          type: string
        SeverityText:
          type: string
        SeverityNumber:
          type: integer
        Body:
          type: string
        Attributes:
          type: object
          additionalProperties: true
        TraceID:
          type: string
        SpanID:
          type: string
        Flags:
          type: integer
        ResourceAttributes:
          type: object
          additionalProperties: true
        Metadata:
          type: object
          additionalProperties: true

      # Config schemas
      ConfigEntryResponse:
        type: object
        properties:
          Key:
            type: string
          Value:
            type: object
            additionalProperties: true
          ETag:
            type: string
          CreatedAt:
            type: string
            format: date-time
          UpdatedAt:
            type: string
            format: date-time
      ConfigUpsertRequest:
        type: object
        properties:
          Value:
            type: object
            additionalProperties: true
        required: [Value]
      ConfigPatchRequest:
        type: object
        description: JSON object to deep-merge into existing Value. Object fields are merged; arrays are replaced.
        additionalProperties: true
      ConfigListResult:
        type: object
        properties:
          Entries:
            type: array
            items:
              type: object
              properties:
                Key:
                  type: string
                UpdatedAt:
                  type: string
                  format: date-time
          NextCursor:
            type: string
          HasMore:
            type: boolean

      # Notification schemas
      NotificationEnqueueRequest:
        type: object
        required: [topic, data]
        properties:
          topic:
            type: string
            description: Notification topic (e.g., mcp, alerts, system)
          data:
            type: object
            additionalProperties: true
          ttl_seconds:
            type: integer
            description: Optional retention in seconds (default 1209600 = 14 days)
          meta:
            type: object
            additionalProperties: true
      NotificationEnqueueResponse:
        type: object
        properties:
          id:
            type: string
          status:
            type: string
            example: queued
          expires_at:
            type: string
            format: date-time
      WSNotification:
        type: object
        required: [type, topic, data, ts, id]
        properties:
          type:
            type: string
            enum: [notification]
          topic:
            type: string
          data:
            type: object
            additionalProperties: true
          ts:
            type: string
            format: date-time
          id:
            type: string
          meta:
            type: object
            additionalProperties: true
          seq:
            type: integer
      # WS control schemas (WSReady, WSDropped) are defined below in the WebSocket control section.
      TraceEntry:
        type: object
        required: [Timestamp, TraceID, SpanID, Name, ServiceName]
        properties:
          Timestamp:
          type: string
          format: date-time
        TraceID:
          type: string
        SpanID:
          type: string
        ParentSpanID:
          type: string
        Name:
          type: string
        SpanKind:
          type: string
        ServiceName:
          type: string
        ResourceAttributes:
          type: object
          additionalProperties: true
        Attributes:
          type: object
          additionalProperties: true
        Events:
          type: array
          items:
            type: object
        StatusCode:
          type: integer
        StatusMessage:
          type: string
        StartTime:
          type: string
          format: date-time
        EndTime:
          type: string
          format: date-time
        Metadata:
          type: object
          additionalProperties: true
    MetricEntry:
      type: object
      required: [Timestamp, ServiceName, Name, Type]
      properties:
        Timestamp:
          type: string
          format: date-time
        ServiceName:
          type: string
        Name:
          type: string
        Type:
          type: string
          enum: [gauge, sum, histogram, summary, exponential_histogram]
        Value:
          type: number
        Count:
          type: integer
        Sum:
          type: number
        Buckets:
          oneOf:
            - type: object
              properties:
                bucket_counts:
                  type: array
                  items:
                    type: integer

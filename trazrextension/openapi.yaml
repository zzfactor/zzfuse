openapi: 3.0.3
info:
  title: Trazr Merged API
  version: 1.0.0
  description: |
    Merged OpenAPI specification for both Insert and Query APIs for Trazr backend.
    Includes endpoints for inserting and querying OpenTelemetry logs, traces, metrics, and profiles.

    Scoping and Authorization:
      - Requests may optionally include organization and project scope via headers `X-Org-ID` and `X-Project-ID` or query params `org_id` and `project_id`.
      - When the caller's JWT contains `org_id` and/or `project_id`, the server enforces that request scope matches those claims.
      - If headers are omitted but query params provided, the server may inject headers for downstream consistency.
servers:
  - url: http://localhost:18888
tags:
  - name: beta
    description: '[BETA] Experimental endpoints for development use only.'
paths:
  # Query endpoints first
  /api/v1/logs:
    get:
      summary: Query logs
      description: Query logs with flexible filters and cursor-based pagination.
      parameters:
        - in: query
          name: start
          schema:
            type: string
            format: date-time
          description: Start time (RFC3339). If omitted and `last` not provided, defaults to 1 hour ago.
        - in: query
          name: end
          schema:
            type: string
            format: date-time
          description: End time (RFC3339). Defaults to now if omitted.
        - in: query
          name: last
          schema:
            type: string
            pattern: '^[0-9]+[smhd]$'
            example: '1h'
          description: Shorthand time window (e.g., 15m, 1h, 2d). Used if start/end omitted. Default last=1h.
        - in: query
          name: q
          schema:
            type: string
          description: Text search over rendered message/body (case-insensitive). For JSON payloads, includes Body and decoded message fields.
        - in: query
          name: q_mode
          schema:
            type: string
            enum: [simple, regex]
            default: simple
          description: Search mode. If regex, `q` is RE2.
        - in: query
          name: q_flags
          schema:
            type: array
            items:
              type: string
              enum: [i, m]
          style: form
          explode: true
          description: Optional regex flags (i=case-insensitive, m=multi-line). Only used when q_mode=regex.
        - in: query
          name: service_in
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Repeat param for OR match across services.
        - in: query
          name: severity_min
          schema:
            type: integer
            minimum: 1
            maximum: 24
          description: Minimum severity_number (inclusive).
        - in: query
          name: severity_max
          schema:
            type: integer
            minimum: 1
            maximum: 24
          description: Maximum severity_number (inclusive).
        - in: query
          name: severity_group_in
          schema:
            type: array
            items:
              type: string
              enum: [TRACE, DEBUG, INFO, WARN, ERROR, FATAL]
          style: form
          explode: true
          description: "Severity groups mapped on server: TRACE 1–4, DEBUG 5–8, INFO 9–12, WARN 13–16, ERROR 17–20, FATAL 21–24."
        - in: query
          name: severity_text_in
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Exact severity_text variants (case-insensitive).
        - in: query
          name: attr.eq
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
          description: "Attribute equals. Example: attr.eq[env]=staging (repeat across keys for AND)."
        - in: query
          name: attr.in
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              description: 'Comma-separated values, e.g., v1,v2'
          description: "Attribute IN list (OR within key). Example: attr.in[env]=dev,staging."
        - in: query
          name: attr.exists
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: boolean
          description: "Attribute existence. Example: attr.exists[user_id]=true."
        - in: query
          name: res_attr.eq
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
          description: Resource attribute equals (same semantics as attr.eq).
        - in: query
          name: res_attr.in
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              description: 'Comma-separated values'
          description: Resource attribute IN (same semantics as attr.in).
        - in: query
          name: res_attr.exists
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: boolean
          description: Resource attribute existence (same semantics as attr.exists).
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Max results.
        - in: query
          name: cursor
          schema:
            type: string
          description: Base64-encoded cursor for pagination.
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction on timestamp for pagination and result ordering.
        - in: query
          name: count_only
          schema:
            type: boolean
            default: false
          description: When true, return only the count of matching log entries instead of the full result set. Pagination parameters are ignored. Not supported with q_mode=regex.
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      responses:
        '200':
          description: Log query result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LogQueryResult'
                  - $ref: '#/components/schemas/CountResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Insert one or more log entries
      description: Insert a single log entry or an array of log entries. Requires JWT Bearer authentication. Returns an array of inserted IDs.
      parameters:
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LogEntry'
                - type: array
                  items:
                    $ref: '#/components/schemas/LogEntry'
            examples:
              single:
                value:
                  Timestamp: "2024-07-10T12:00:00Z"
                  ServiceName: "api"
                  SeverityText: "INFO"
                  Body: "User logged in"
                  Attributes: { user_id: "123" }
              batch:
                value:
                  - Timestamp: "2024-07-10T12:00:00Z"
                    ServiceName: "api"
                    SeverityText: "INFO"
                    Body: "User logged in"
                  - Timestamp: "2024-07-10T12:01:00Z"
                    ServiceName: "api"
                    SeverityText: "ERROR"
                    Body: "Login failed"
      responses:
        '200':
          description: Insert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertResult'
              examples:
                single:
                  value:
                    IDs: ["abc123"]
                    Status: inserted
                batch:
                  value:
                    IDs: ["abc123", "def456"]
                    Status: inserted
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/spans:
    get:
      summary: Query spans
      description: Query spans with flexible filters and pagination.
  /api/v1/spans/{id}:
    get:
      summary: Get a single span by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Span ID (primary key)
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      responses:
        '200':
          description: Span entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceEntryResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - in: query
          name: start
          schema:
            type: string
            format: date-time
          description: "Start time (RFC3339, optional; default: 1 hour ago)"
        - in: query
          name: end
          schema:
            type: string
            format: date-time
          description: "End time (RFC3339, optional; default: now)"
        - in: query
          name: service
          schema:
            type: string
          description: Filter by service name
        - in: query
          name: trace_id
          schema:
            type: string
          description: Filter by trace ID
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Max results
        # Cursor-based pagination is not currently accepted by the handler for spans
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction on timestamp for pagination and result ordering
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      responses:
        '200':
          description: Span query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceQueryResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Insert one or more span entries
      description: Insert a single span entry or an array of span entries. Requires JWT Bearer authentication. Returns an array of inserted IDs.
      parameters:
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TraceEntry'
                - type: array
                  items:
                    $ref: '#/components/schemas/TraceEntry'
      responses:
        '200':
          description: Insert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertResult'
              examples:
                single:
                  value:
                    IDs: ["traceid1"]
                    Status: inserted
                batch:
                  value:
                    IDs: ["traceid1", "traceid2"]
                    Status: inserted
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/metrics:
    get:
      summary: Query metrics
      description: Query metrics from any supported OpenTelemetry metric table, with cursor-based pagination.
      responses:
        '200':
          description: Metric points and pagination, or a count when count_only is enabled.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MetricsResponse'
                - type: object
                  required:
                  - count
                  properties:
                    count:
                      type: integer
                      format: int64
  /api/v1/metrics/{id}:
    get:
      summary: Get a single metric by ID (auto-detects type)
      deprecated: true
      description: Probes metric tables in a fixed order. IDs may overlap; use the typed route to select the intended
        table.
  /api/v1/metrics/{type}/{id}:
    get:
      summary: Get a single metric by type and ID
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - gauge
          - sum
          - histogram
          - summary
          - exponential_histogram
        required: true
        description: Metric type
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: 'Start time (RFC3339, optional; default: 1 hour ago)'
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: 'End time (RFC3339, optional; default: now)'
      - in: query
        name: service
        schema:
          type: string
        description: Filter by service name
      - in: query
        name: metric
        schema:
          type: string
        description: Filter by metric name
      - in: query
        name: limit
        schema:
          type: integer
          default: 100
        description: Max results
      - in: query
        name: cursor
        schema:
          type: string
        description: Base64-encoded cursor for pagination
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction on timestamp for pagination and result ordering
      - in: query
        name: schema
        schema:
          type: string
        description: Postgres schema to use (default otel)
      - $ref: '#/components/parameters/OrgIDHeader'
      - $ref: '#/components/parameters/ProjectIDHeader'
      - $ref: '#/components/parameters/OrgIDQuery'
      - $ref: '#/components/parameters/ProjectIDQuery'
      responses:
        '200':
          description: Metric query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricQueryResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Insert one or more metric entries
      description: Insert a single metric entry or an array of metric entries. The type field is required. Requires
        JWT Bearer authentication. Returns an array of inserted IDs.
      parameters:
      - in: query
        name: schema
        schema:
          type: string
        description: Postgres schema to use (default otel)
      - $ref: '#/components/parameters/OrgIDHeader'
      - $ref: '#/components/parameters/ProjectIDHeader'
      - $ref: '#/components/parameters/OrgIDQuery'
      - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/MetricEntry'
              - type: array
                items:
                  $ref: '#/components/schemas/MetricEntry'
            examples:
              gauge:
                value:
                  Timestamp: '2024-07-10T12:00:00Z'
                  ServiceName: api
                  Name: cpu
                  Type: gauge
                  Value: 1.23
              sum:
                value:
                  Timestamp: '2024-07-10T12:00:00Z'
                  ServiceName: api
                  Name: cpu_sum
                  Type: sum
                  Value: 2.34
              histogram:
                value:
                  Timestamp: '2024-07-10T12:00:00Z'
                  ServiceName: api
                  Name: latency_hist
                  Type: histogram
                  Count: 1
                  Sum: 10.0
                  Buckets:
                    bucket_counts:
                    - 1
                    - 2
                    - 3
                    explicit_bounds:
                    - 0.1
                    - 1
                    - 10
              summary:
                value:
                  Timestamp: '2024-07-10T12:00:00Z'
                  ServiceName: api
                  Name: response_summary
                  Type: summary
                  Count: 1
                  Sum: 5.0
                  Quantiles:
                    '0.5': 2.5
                    '0.9': 4.5
              exponential_histogram:
                value:
                  Timestamp: '2024-07-10T12:00:00Z'
                  ServiceName: api
                  Name: exp_hist
                  Type: exponential_histogram
                  Count: 1
                  Sum: 7.0
                  Buckets:
                    scale: 1
                    zero_count: 0
                    positive_offset: 0
                    positive_bucket_counts:
                    - 1
                    - 2
                    - 3
                    negative_offset: 0
                    negative_bucket_counts:
                    - 0
                    - 0
                    - 0
      responses:
        '200':
          description: Insert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertResult'
              examples:
                single:
                  value:
                    IDs:
                    - metricid1
                    Status: inserted
                batch:
                  value:
                    IDs:
                    - metricid1
                    - metricid2
                    Status: inserted
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/profiles:
    get:
      tags:
      - Profiles
      summary: Retrieve profiles with pagination
      description: Requires bearer authentication and access to the requested schema. Versioned rows expose the complete
        OTLP JSON dictionary and exact base64 bytes; historical binary remains opaque.
      parameters:
      - name: start
        in: query
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        schema:
          type: string
          format: date-time
      - name: last
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          minimum: 1
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: service
        in: query
        schema:
          type: string
      - name: profile_type
        in: query
        schema:
          type: string
      - &id001
        name: schema
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Profiles retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilesResponse'
        '400':
          description: Invalid query
        '401':
          description: Authentication required
        '403':
          description: Schema access denied
        '422':
          description: Invalid query parameters
        '500':
          description: Query failed
    post:
      tags:
      - Profiles
      summary: Insert one or more profile entries
      description: Requires bearer authentication and schema access. Versioned payloads are validated before any write;
        omitted version preserves legacy opaque input.
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ProfileEntryDTO'
              - type: array
                items:
                  $ref: '#/components/schemas/ProfileEntryDTO'
                minItems: 1
      responses:
        '200':
          description: Profiles inserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: integer
                      format: int64
                  status:
                    type: string
                    enum:
                    - inserted
                required:
                - ids
                - status
        '400':
          description: Invalid format, version, payload, or timestamp; no writes performed
        '401':
          description: Authentication required
        '403':
          description: Schema access denied
        '500':
          description: Insert failed
  /api/v1/runs:
    get:
      summary: Query runs
      description: Query runs with flexible filters and cursor-based pagination.
  /api/v1/runs/{id}:
    get:
      summary: Get a single run by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Run ID
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
      responses:
        '200':
          description: Run entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEntryResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - in: query
          name: start
          schema:
            type: string
            format: date-time
          description: "Start time (RFC3339, optional; default: 1 hour ago)"
        - in: query
          name: end
          schema:
            type: string
            format: date-time
          description: "End time (RFC3339, optional; default: now)"
        - in: query
          name: service
          schema:
            type: string
          description: Filter by service name
        - in: query
          name: name
          schema:
            type: string
          description: Filter by run name
        - in: query
          name: session_id
          schema:
            type: string
          description: Filter by session ID
        - in: query
          name: run_type
          schema:
            type: integer
          description: "Filter by run type (1: time based, 2: trace based)"
        - in: query
          name: active_only
          schema:
            type: boolean
            default: false
          description: Filter to only active (non-ended) runs
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Max results
        - in: query
          name: cursor
          schema:
            type: string
          description: Base64-encoded cursor for pagination
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      responses:
        '200':
          description: Run query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunQueryResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Insert one or more run entries
      description: Insert a single run entry or an array of run entries. Requires JWT Bearer authentication. Returns an array of inserted IDs.
      parameters:
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RunEntry'
                - type: array
                  items:
                    $ref: '#/components/schemas/RunEntry'
            examples:
              single:
                value:
                  ServiceName: "api"
                  Name: "request-processing"
                  StartTimestampNs: 1754501063000000000
                  RunType: 1
                  SessionID: "user-session-123"
              batch:
                value:
                  - ServiceName: "api"
                    Name: "request-processing"
                    StartTimestampNs: 1754501063000000000
                    RunType: 1
                    SessionID: "user-session-123"
                  - ServiceName: "api"
                    Name: "data-processing"
                    StartTimestampNs: 1754501064000000000
                    RunType: 2
                    SessionID: "user-session-123"
      responses:
        '200':
          description: Insert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertResult'
              examples:
                single:
                  value:
                    IDs: ["123"]
                    Status: inserted
                batch:
                  value:
                    IDs: ["123", "124"]
                    Status: inserted
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update run metadata
      description: Update metadata for a specific run by ID. Requires JWT Bearer authentication.
      parameters:
        - in: query
          name: schema
          schema:
            type: string
          description: Postgres schema to use (default otel)
        - $ref: '#/components/parameters/OrgIDHeader'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - $ref: '#/components/parameters/OrgIDQuery'
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ID, Metadata]
              properties:
                ID:
                  type: integer
                  description: Run ID to update
                Metadata:
                  type: object
                  additionalProperties: true
                  description: Metadata to update
            examples:
              update_metadata:
                value:
                  ID: 123
                  Metadata:
                    SPAN_COUNT: 100
                    LOG_COUNT: 50
                    LOG_ERROR_COUNT: 2
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    example: updated
        '400':
          description: Invalid input

    MetricEntryResponse:
      type: object
      description: A metric point. Fields depend on its type; absent optional values are omitted, while present zero
        values are retained. IDs are unique within a metric table, so typed ID routes disambiguate overlapping IDs.
      required:
      - id
      - timestamp_ns
      - timestamp
      - service_name
      - name
      properties:
        id:
          type: integer
          format: int64
        timestamp_ns:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        service_name:
          type: string
        service_namespace:
          type: string
        service_instance_id:
          type: string
        name:
          type: string
        description:
          type: string
        unit:
          type: string
        scope_name:
          type: string
        scope_version:
          type: string
        resource_schema_url:
          type: string
        scope_schema_url:
          type: string
        start_time:

paths:
  /api/v1/config/{config_type}:
    get:
      tags:
        - Configuration
      summary: List configurations by type
      description: |
        Retrieve a paginated list of configurations for the specified type.
        
        Supported configuration types:
        - **schemas**: Database schema configurations for telemetry data routing
        - **processors**: Processor mapping configurations for data processing pipelines
        - **embeddings**: Embedding provider configurations for vector generation
        - **templates**: Template configurations for data transformation
        - **vectorstores**: Vector store provider configurations for similarity search
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum: [schemas, processors, embeddings, templates, vectorstores]
          description: Type of configuration to retrieve
        - $ref: ../components/parameters.yaml#/components/parameters/Limit
        - $ref: ../components/parameters.yaml#/components/parameters/Cursor
        - $ref: ../components/parameters.yaml#/components/parameters/Direction
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by configuration name (partial match)
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status (true/false)
        - name: priority
          in: query
          required: false
          schema:
            type: integer
          description: Filter by priority (only applicable for schema configs)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search in name and description fields
      responses:
        '200':
          description: Successfully retrieved configurations
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/ConfigListResponse
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '500':
          $ref: ../components/responses.yaml#/components/responses/InternalServerError
    post:
      tags:
        - Configuration
      summary: Create a new configuration
      description: |
        Create a new configuration of the specified type.
        
        **Authentication Required**: Admin authentication is required for all configuration management operations.
        
        **Configuration Types**:
        - **schemas**: Create database schema configurations for routing telemetry data to specific database schemas
        - **processors**: Create processor mapping configurations that define how data flows through processing pipelines
        - **embeddings**: Create embedding provider configurations for AI/ML vector generation services
        - **templates**: Create template configurations for data transformation and formatting
        - **vectorstores**: Create vector store provider configurations for similarity search backends
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum: [schemas, processors, embeddings, templates, vectorstores]
          description: Type of configuration to create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ConfigCreateRequest
      responses:
        '201':
          description: Configuration created successfully
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/ConfigResponse
              examples:
                schema_created:
                  summary: Schema Configuration Created
                  value:
                    id: 1
                    name: "production-otel"
                    description: "Production OpenTelemetry schema"
                    enabled: true
                    priority: 1
                    created_at: "2024-01-15T10:30:00Z"
                    updated_at: "2024-01-15T10:30:00Z"
                    metadata:
                      version: "1.0"
                      environment: "production"
                    config:
                      database_schema: "otel"
                      routing:
                        logs: "otel_logs"
                        traces: "otel_traces"
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '409':
          description: Configuration with the same name already exists
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/Error
              example:
                error: "Configuration with name 'production-otel' already exists"
                code: "conflict"
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableEntity
        '500':
          $ref: ../components/responses.yaml#/components/responses/InternalServerError

  /api/v1/config/{config_type}/{id}:
    get:
      tags:
        - Configuration
      summary: Get configuration by ID
      description: |
        Retrieve a specific configuration by ID and type.
        
        Returns detailed configuration information including metadata, configuration data, and timestamps.
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum: [schemas, processors, embeddings, templates, vectorstores]
          description: Type of configuration
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Configuration ID
      responses:
        '200':
          description: Successfully retrieved configuration
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/ConfigResponse
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '500':
          $ref: ../components/responses.yaml#/components/responses/InternalServerError
    put:
      tags:
        - Configuration
      summary: Update configuration
      description: |
        Update an existing configuration by ID and type.
        
        Supports partial updates - only provided fields will be modified. 
        **Note**: Some configuration changes may require system restart to take effect.
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum: [schemas, processors, embeddings, templates, vectorstores]
          description: Type of configuration
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Configuration ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ConfigUpdateRequest
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/ConfigResponse
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableEntity
        '500':
          $ref: ../components/responses.yaml#/components/responses/InternalServerError
    delete:
      tags:
        - Configuration
      summary: Delete configuration
      description: |
        Delete a configuration by ID and type.
        
        **Warning**: Deleting configurations may affect dependent services and data processing pipelines.
        The system will validate dependencies before deletion and return an error if the configuration is in use.
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum: [schemas, processors, embeddings, templates, vectorstores]
          description: Type of configuration
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Configuration ID
      responses:
        '204':
          description: Configuration deleted successfully
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '500':
          $ref: ../components/responses.yaml#/components/responses/InternalServerError

  /api/v1/config/statistics:
    get:
      tags:
        - Configuration
      summary: Get configuration statistics
      description: |
        Retrieve statistics about all configuration types including counts for:
        - Schema configurations
        - Processor configurations  
        - Embedding configurations
        - Template configurations
        - Vector store configurations
        
        **Authentication Required**: Admin authentication is required.
      responses:
        '200':
          description: Successfully retrieved statistics
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/ConfigStatisticsResponse
              example:
                schema_configs: 3
                processor_configs: 5
                embedding_configs: 2
                template_configs: 4
                vectorstore_configs: 1
                total_configs: 15
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '500':
          $ref: ../components/responses.yaml#/components/responses/InternalServerError

paths:
  /api/v1/auth/request-password-reset:
    post:
      tags:
      - Authentication
      summary: Request private password reset email
      security: []
      description: Uses a bounded asynchronous private SMTP queue and a fixed frontend reset URL with token only in its browser fragment. Valid requests receive
        the same generic response for known or missing accounts and delivery/storage failures. Tokens are never
        returned or logged. No token/account lookup occurs when secure delivery is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/PasswordResetRequestRequest'
      responses:
        '200':
          description: Generic accepted response independent of account existence or delivery outcome
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - if the account exists, a password reset email will be sent
        '400':
          description: Invalid email or request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: Secure private SMTP delivery or frontend reset URL is unconfigured or invalid; no token issued
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Consume one-time token and reset password
      security: []
      description: Reset tokens expire after one hour. Password update and token consumption commit atomically.
        Concurrent replay, reuse and expired tokens are rejected; a failed password update does not consume the
        token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/PasswordResetPerformRequest'
      responses:
        '200':
          description: Password reset completed
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - password reset successful
        '400':
          description: Invalid input, expired token or token replay
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '500':
          description: Password reset could not complete
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string

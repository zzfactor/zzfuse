  /api/v1/config/{config_type}:
    get:
      tags:
        - Configuration
      summary: List configurations by type
      description: |
        Retrieve a paginated list of configurations for the specified type.

        Supported configuration types:
        - **schemas**: Database schema configurations for telemetry data routing
        - **processors**: Processor mapping configurations for data processing pipelines
        - **embeddings**: Embedding provider configurations for vector generation
        - **templates**: Template configurations for data transformation
        - **vectorstores**: Vector store provider configurations for similarity search
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum:
              - schemas
              - processors
              - embeddings
              - templates
              - vectorstores
          description: Type of configuration to retrieve
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Direction'
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by configuration name (partial match)
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by enabled status (true/false)
        - name: priority
          in: query
          required: false
          schema:
            type: integer
          description: Filter by priority (only applicable for schema configs)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search in name and description fields
      responses:
        '200':
          description: Successfully retrieved configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Configuration
      summary: Create a new configuration
      description: |
        Create a new configuration of the specified type.

        **Authentication Required**: Admin authentication is required for all configuration management operations.

        **Configuration Types**:
        - **schemas**: Create database schema configurations for routing telemetry data to specific database schemas
        - **processors**: Create processor mapping configurations that define how data flows through processing pipelines
        - **embeddings**: Create embedding provider configurations for AI/ML vector generation services
        - **templates**: Create template configurations for data transformation and formatting
        - **vectorstores**: Create vector store provider configurations for similarity search backends
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum:
              - schemas
              - processors
              - embeddings
              - templates
              - vectorstores
          description: Type of configuration to create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigCreateRequest'
      responses:
        '201':
          description: Configuration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
              examples:
                schema_created:
                  summary: Schema Configuration Created
                  value:
                    id: 1
                    name: production-otel
                    description: Production OpenTelemetry schema
                    enabled: true
                    priority: 1
                    created_at: '2024-01-15T10:30:00Z'
                    updated_at: '2024-01-15T10:30:00Z'
                    metadata:
                      version: '1.0'
                      environment: production
                    config:
                      database_schema: otel
                      routing:
                        logs: otel_logs
                        traces: otel_traces
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Configuration with the same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Configuration with name 'production-otel' already exists
                code: conflict
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

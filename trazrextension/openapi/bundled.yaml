          required: true
          schema:
            type: string
      responses:
        '200':
          description: Config entry
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigEntryResponse'
              examples:
                sample:
                  value:
                    Key: theme
                    Value:
                      color: dark
                      font: system
                    ETag: '"3a7f-5c2"'
                    CreatedAt: '2025-08-19T12:34:56Z'
                    UpdatedAt: '2025-08-19T12:35:56Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Configuration
      summary: Upsert a user config (replace)
      operationId: userConfigsUpsert
      description: |
        Security: Requires JWT (bearerAuth). The token must represent the calling user.
        Use If-Match with the previous ETag to ensure optimistic concurrency.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true

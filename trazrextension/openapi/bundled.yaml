          minLength: 1
          maxLength: 255
          description: Configuration name (required)
        description:
          type: string
          description: Optional configuration description
        enabled:
          type: boolean
          default: true
          description: Whether this configuration should be active
        priority:
          type: integer
          description: Configuration priority for ordering

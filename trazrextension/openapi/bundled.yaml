          additionalProperties: true
          description: Additional configuration metadata
        config:
          type: object
          additionalProperties: true
          description: Type-specific configuration data
      required:
        - name
        - enabled
        - priority
        - config
      examples:
        schema_config:
          summary: Schema Configuration
          value:
            name: production-otel
            description: Production OpenTelemetry schema
            enabled: true
            priority: 1
            metadata:
              version: '1.0'
              environment: production
            config:
              database_schema: otel
              priority: 1
              routing:
                logs: otel_logs
                traces: otel_traces
                metrics: otel_metrics
        processor_config:
          summary: Processor Configuration
          value:
            name: logs-embedding-processor
            description: Process logs for embedding generation
            enabled: true
            priority: 1
            metadata:
              processing_mode: batch
              batch_size: 100
            config:
              database_id: 1
              vectorstore_id: 1
              template_id: 1
              processing_mode: template
              routing:
                logs: otel_logs
              filter:
                signal_type: logs
                level:
                  - error
                  - warn
        embedding_config:
          summary: Embedding Configuration
          value:
            name: openai-ada-002
            description: OpenAI text-embedding-ada-002 provider
            enabled: true
            priority: 1
            metadata:
              provider_type: openai
              rate_limit: 1000
            config:
              provider: openai
              model: text-embedding-ada-002
              dimension: 1536
              max_context_length: 8191
              rate_limit: 1000
              timeout: 30
              normalize: false
              headers:
                Authorization: Bearer sk-...
              endpoint: https://api.openai.com/v1/embeddings
        template_config:
          summary: Template Configuration
          value:
            name: log-embedding-template
            description: Template for processing log entries
            enabled: true
            priority: 1
            metadata:
              version: '1.0'
              template_type: embedding
            config:
              content:
                log_template: '{{.message}} {{.level}}'
                trace_template: '{{.operation_name}} {{.service_name}}'
              template_metadata:
                fields:
                  - message
                  - level
                  - timestamp
                required:
                  - message
        vectorstore_config:
          summary: Vector Store Configuration
          value:
            name: postgres-vectorstore
            description: PostgreSQL vector store with pgvector
            enabled: true
            priority: 1
            metadata:
              store_type: postgres
              version: '1.0'
            config:
              provider: postgres
              endpoint: postgresql://localhost:5432/vectordb
              user: vectoruser
              database: vectors
              embedding_id: 1
              batch_size: 100
              flush_interval_ms: 200
              max_retries: 3
              max_open_conns: 25
              max_idle_conns: 5
              conn_max_lifetime_ms: 3600000
              batch_error_policy: retry
              max_concurrent_batches: 8
              vendor_specific_options:
                index_type: ivfflat
                lists: 100

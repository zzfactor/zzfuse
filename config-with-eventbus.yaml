# Event bus settings are read from environment variables, not extension YAML.
# For NATS, set EVENT_BUS_TYPE=nats and NATS_URL=nats://localhost:4222.
# See pkg/event/config.go for the supported tuning variables.
extensions:
  zzfuse_auth:
    signing_key: ${env:TRAZR_INGESTION_SIGNING_KEY}
    credentials:
      default:
        token: ${env:TRAZR_INGESTION_TOKEN}
        schema: ${env:TRAZR_INGESTION_SCHEMA:-otel}
        epoch: ${env:TRAZR_INGESTION_EPOCH:-1}
  file_storage/ingestion:
    directory: ${env:TRAZR_QUEUE_DIRECTORY:-/var/lib/zzfuse/queue}
    create_directory: true
    directory_permissions: "0700"
    fsync: true
  trazr: {}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: zzfuse_auth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: zzfuse_auth

# Context-dropping processors and queue batching are intentionally omitted.
# Receiver-authenticated tenant identity must survive every request unchanged.
exporters:
  trazr:
    authenticator: zzfuse_auth
    sending_queue:
      enabled: true
      storage: file_storage/ingestion
      queue_size: 10000
      num_consumers: 1
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
  file:
    path: ./logs/trazr2.log
  debug:
    verbosity: detailed

service:
  extensions: [trazr, zzfuse_auth, file_storage/ingestion]
  pipelines:
    profiles:
      receivers: [otlp]
      # Profiles share the authenticated tenant and durable queue boundary.
      processors: []
      exporters: [trazr]
    traces:
      receivers: [otlp]
      processors: []
      exporters: [trazr, debug]
    metrics:
      receivers: [otlp]
      processors: []
      exporters: [trazr, debug]
    logs:
      receivers: [otlp]
      processors: []
      exporters: [trazr, debug]

name: Bug report
description: Report a reproducible problem without credentials or private telemetry.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include versions and a minimal configuration with secrets removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized logs

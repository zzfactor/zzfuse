version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /build/database
      - /build/otel
      - /frontend
      - /services
      - /trazr-mcp
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns: ['*']
  - package-ecosystem: gomod
    directories:
      - /pkg/auth
      - /pkg/auth/client
      - /pkg/config
      - /pkg/event
      - /pkg/metrics
      - /pkg/repository
      - /pkg/util
      - /trazrexporter
      - /trazrextension
      - /trazrprocessor
      - /trazr-mcp
      - /trazr-otel
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Major tooling/runtime/table migrations require their own compatibility work.
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      frontend-dependencies:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /services
    schedule:
      interval: weekly
    # Regenerate with the documented uv universal/Python 3.11 command. The
    # standard updater drops platform/Requires-Python conditions from this lock.
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
